# Real-time churn stack: REST API + Streamlit dashboard sharing one model registry.
#
#   docker compose run --rm api python -m churn train   # populate models/registry
#   docker compose up
#
# API       -> http://localhost:8000  (docs at /docs)
# Dashboard -> http://localhost:8501

services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      CHURN_LOG_JSON: "true"
      CHURN_PREDICTION_LOG_PATH: /app/logs/predictions.jsonl
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: runtime
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
    environment:
      CHURN_API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
