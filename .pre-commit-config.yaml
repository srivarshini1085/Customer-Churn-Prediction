# Install once with `pre-commit install`; run on everything with `pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy runs from the project's own environment (language: system) so it sees
  # the real pandas / sklearn / fastapi installs instead of an isolated copy.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, churn/)
        entry: mypy churn
        language: system
        types: [python]
        pass_filenames: false
